name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew :tika-parser-jtd:publishAndReleaseToMavenCentral --no-configuration-cache

      - name: Prepare Release Assets
        run: |
          mkdir -p release-assets
          # Tika Parser Server Drop-in JAR (bundles kotlin-stdlib for /tika-extras/)
          cp tika-parser-jtd/build/libs/tika-parser-jtd-*-server.jar release-assets/
          # CLI Standalone Executable JAR (single fat jar, java -jar executable)
          cp tika-parser-jtd-cli/build/libs/tika-parser-jtd-cli-*-standalone.jar release-assets/
          # CLI Distribution Zip (jar + runtime-classpath/)
          if [ -d tika-parser-jtd-cli/build/distributions ]; then
            cp tika-parser-jtd-cli/build/distributions/tika-parser-jtd-cli-*.zip release-assets/ || true
          fi
          echo "=== Release Assets ==="
          ls -lh release-assets/

      - name: Upload Build Artifacts (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: release-jars
          path: release-assets/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
